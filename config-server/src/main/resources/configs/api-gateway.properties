server.port=${PORT:8080}

# Chi dinh tuyen /api/v1/** va /ws: duong /internal/** cua cac service KHONG co route nen ben ngoai khong goi duoc.
# Route cu the (order 0) dung truoc route theo nhom (order 10) cho cac duong dung chung tien to.

spring.cloud.gateway.server.webflux.routes[0].id=payment-overlap
spring.cloud.gateway.server.webflux.routes[0].uri=lb://payment-service
spring.cloud.gateway.server.webflux.routes[0].predicates[0]=Path=/api/v1/trips/*/payments,/api/v1/drivers/me/wallet/**
spring.cloud.gateway.server.webflux.routes[0].order=0

spring.cloud.gateway.server.webflux.routes[1].id=trip-overlap
spring.cloud.gateway.server.webflux.routes[1].uri=lb://trip-service
spring.cloud.gateway.server.webflux.routes[1].predicates[0]=Path=/api/v1/drivers/me/offers/**
spring.cloud.gateway.server.webflux.routes[1].order=0

spring.cloud.gateway.server.webflux.routes[2].id=identity
spring.cloud.gateway.server.webflux.routes[2].uri=lb://identity-service
spring.cloud.gateway.server.webflux.routes[2].predicates[0]=Path=/api/v1/auth/**,/api/v1/users/**,/api/v1/admin/users/**,/api/v1/admin/platform/identity-service/**
spring.cloud.gateway.server.webflux.routes[2].order=10

spring.cloud.gateway.server.webflux.routes[3].id=driver
spring.cloud.gateway.server.webflux.routes[3].uri=lb://driver-service
spring.cloud.gateway.server.webflux.routes[3].predicates[0]=Path=/api/v1/drivers/**,/api/v1/review/**,/api/v1/admin/drivers/**,/api/v1/admin/platform/driver-service/**
spring.cloud.gateway.server.webflux.routes[3].order=10

spring.cloud.gateway.server.webflux.routes[4].id=pricing
spring.cloud.gateway.server.webflux.routes[4].uri=lb://pricing-service
spring.cloud.gateway.server.webflux.routes[4].predicates[0]=Path=/api/v1/quotes/**,/api/v1/admin/pricing-rules/**,/api/v1/admin/platform/pricing-service/**
spring.cloud.gateway.server.webflux.routes[4].order=10

spring.cloud.gateway.server.webflux.routes[5].id=trip
spring.cloud.gateway.server.webflux.routes[5].uri=lb://trip-service
spring.cloud.gateway.server.webflux.routes[5].predicates[0]=Path=/api/v1/trips/**,/api/v1/offers/**,/api/v1/support/**,/api/v1/admin/platform/trip-service/**
spring.cloud.gateway.server.webflux.routes[5].order=10

spring.cloud.gateway.server.webflux.routes[6].id=payment
spring.cloud.gateway.server.webflux.routes[6].uri=lb://payment-service
spring.cloud.gateway.server.webflux.routes[6].predicates[0]=Path=/api/v1/payments/**,/api/v1/finance/**,/api/v1/admin/commission-rules/**,/api/v1/admin/platform/payment-service/**
spring.cloud.gateway.server.webflux.routes[6].order=10

# WebSocket STOMP: gateway nang cap ket noi va chuyen tiep nguyen khung toi trip-service
spring.cloud.gateway.server.webflux.routes[7].id=realtime-ws
spring.cloud.gateway.server.webflux.routes[7].uri=lb:ws://trip-service
spring.cloud.gateway.server.webflux.routes[7].predicates[0]=Path=/ws/**
spring.cloud.gateway.server.webflux.routes[7].order=0
