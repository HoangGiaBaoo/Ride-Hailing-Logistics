spring.application.name=config-server
server.port=${PORT:8888}

# Backend native: doc file cau hinh tu classpath (configs/) va them thu muc config/ o goc du an,
# noi chua bi mat local (gitignored). Chay tu thu muc module hay thu muc goc deu tim thay.
spring.profiles.active=native
spring.cloud.config.server.native.search-locations=classpath:/configs/,optional:file:./config/,optional:file:../config/

eureka.client.service-url.defaultZone=${EUREKA_URL:http://localhost:8761/eureka/}
eureka.instance.prefer-ip-address=true
