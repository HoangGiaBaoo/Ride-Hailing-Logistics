spring.application.name=config-server
server.port=${PORT:8888}

# Backend composite, thu tu = do uu tien:
# 1. native: thu muc config/ cua repo chinh (gitignored) — chi chua bi mat local (JWT_SECRET, mat khau DB...)
# 2. git: repo cau hinh rieng config-repo/ — moi cau hinh con lai, co lich su commit, doi duoc khi dang chay
spring.profiles.active=composite
spring.cloud.config.server.composite[0].type=native
spring.cloud.config.server.composite[0].search-locations=optional:file:./config/,optional:file:../config/
spring.cloud.config.server.composite[1].type=git
# start-all.ps1 truyen duong dan tuyet doi; mac dinh: chay tu thu muc module config-server/
spring.cloud.config.server.composite[1].uri=${CONFIG_GIT_URI:file:../config-repo}
spring.cloud.config.server.composite[1].default-label=main
spring.cloud.config.server.composite[1].clone-on-start=true
# Moi request lay commit moi nhat (repo local, re)
spring.cloud.config.server.composite[1].refresh-rate=0

# Spring Cloud Bus qua Kafka: POST /actuator/busrefresh -> moi service tai lai cau hinh
spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
spring.cloud.bus.enabled=true
spring.cloud.bus.destination=springCloudBus
management.endpoints.web.exposure.include=health,info,busrefresh

eureka.client.service-url.defaultZone=${EUREKA_URL:http://localhost:8761/eureka/}
eureka.instance.prefer-ip-address=true
# Refresh (busrefresh) khong dung lai EurekaClient: dung lai lam mat hostname -> NPE trong eureka-client 2.0.x
eureka.client.refresh.enable=false
