spring.application.name=ride-hailing-logistics

# Bi mat KHONG de o day: Spring Boot tu nap ./config/application.properties (gitignored) khi chay tu thu muc goc,
# hoac dat bien moi truong DB_PASSWORD, JWT_SECRET, PAYMENT_SANDBOX_SECRET.

# ---------- PostgreSQL ----------
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/ride_hailing}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.hikari.maximum-pool-size=30

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.jpa.show-sql=false

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# ---------- Redis ----------
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.database=0
spring.data.redis.timeout=2s

# ---------- Web ----------
server.port=${PORT:8080}
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB
spring.threads.virtual.enabled=true
springdoc.swagger-ui.path=/swagger-ui.html

# ---------- Bao mat ----------
app.security.jwt.secret=${JWT_SECRET}
app.security.jwt.issuer=ride-hailing-logistics
app.security.jwt.access-token-ttl=15m
app.security.jwt.refresh-token-ttl=14d
app.security.login.max-failed-attempts=5
app.security.login.lock-duration=15m
app.security.password-reset-ttl=30m

# Rate limit cua so co dinh 1 phut (NFR-SEC-007)
app.rate-limit.enabled=true
app.rate-limit.login-per-minute=10
app.rate-limit.telemetry-per-minute=40
app.rate-limit.quote-per-minute=30
app.rate-limit.trip-per-minute=10
app.rate-limit.offer-per-minute=30
app.rate-limit.payment-per-minute=10
app.rate-limit.upload-per-minute=10
app.rate-limit.default-per-minute=300

# ---------- Vi tri (TBD-14) ----------
app.location.freshness=30s
app.location.max-accuracy-for-matching-meters=50
app.location.max-accuracy-meters=500
app.location.max-future-skew=30s
app.location.max-age=5m
app.location.max-speed-mps=70
app.location.recommended-interval=3s

# ---------- Ban do (TBD-02) ----------
app.map.provider=haversine
app.map.road-factor=1.3
app.map.average-speed-kmh=25
app.map.osrm-url=http://router.project-osrm.org
app.map.timeout=2s

# Vung phuc vu: khung toa do TP.HCM
app.regions[0].code=HCM
app.regions[0].min-lat=10.35
app.regions[0].max-lat=11.20
app.regions[0].min-lng=106.35
app.regions[0].max-lng=107.05

# ---------- Gia (TBD-03..05) ----------
app.pricing.quote-ttl=5m
app.pricing.rounding-step=1000
app.pricing.currency=VND
app.pricing.surge.version=surge-v1
app.pricing.surge.geohash-precision=5
app.pricing.surge.window=5m
app.pricing.surge.sensitivity=0.25
app.pricing.surge.min=1.0
app.pricing.surge.max=2.5

# ---------- Matching (TBD-06) ----------
app.dispatch.radii-km=2,4,6
app.dispatch.offer-timeout=15s
app.dispatch.matching-timeout=60s
app.dispatch.retry-interval=3s
app.dispatch.max-candidates=20
app.dispatch.rank-version=rank-v1

# ---------- Chuyen ----------
app.trip.require-start-pin=true
app.trip.arrival-radius-meters=300
app.trip.realtime-grace-period=2m
app.trip.free-cancel-window=2m
app.trip.no-show-wait=5m
app.trip.cancel-fee-after-accept=10000
app.trip.cancel-fee-arrived=20000
app.trip.max-package-weight-motorbike-kg=30
app.trip.max-package-weight-van-kg=500

# ---------- Thanh toan (TBD-09) ----------
app.payment.sandbox.secret=${PAYMENT_SANDBOX_SECRET}
app.payment.sandbox.callback-delay=1s
# true: moi giao dich sandbox deu that bai, de demo luong thu lai (FR-PAY-008)
app.payment.sandbox.force-failure=false
app.payment.callback-tolerance=5m
app.payment.max-attempts=3

# ---------- Outbox ----------
app.outbox.poll-interval=300ms
app.outbox.batch-size=50
app.outbox.max-attempts=8

# ---------- Luu tai lieu tai xe (ngoai classpath) ----------
app.storage.documents-dir=./storage/documents
