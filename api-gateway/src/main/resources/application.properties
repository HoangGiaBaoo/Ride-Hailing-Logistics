spring.application.name=api-gateway

# Toan bo cau hinh con lai lay tu config-server (config-repo/api-gateway.properties)
spring.config.import=configserver:${CONFIG_SERVER_URL:http://localhost:8888}
spring.cloud.config.fail-fast=true

# Trang demo tinh hay sua: bat trinh duyet hoi lai server moi lan (ETag/Last-Modified) thay vi dung ban cache cu
spring.web.resources.cache.cachecontrol.no-cache=true
